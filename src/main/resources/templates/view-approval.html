<h1>View Student</h1>


<table class="center" style="width:50%">
  <tr>
    <th>User ID</th>
    <th>Student Name</th>
    <th>Status</th>
  </tr>
  <tr data-th-each="user : ${approvalList}">
    <td data-th-text="${user.userId}"></td>
    <td data-th-text="${user.name}"></td>
    <td data-th-text="${user.status}"></td>x`
    <td>
      <a data-th-href="@{/user/update/{id} (id=${user.userId})}"><button>Approve</button></a>
      <a data-th-href="@{/user/delete/{id} (id=${user.userId})}"><button>Decline</button></a>
    </td>
  </tr>
</table>
