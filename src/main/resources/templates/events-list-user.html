<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/stylehome.css">
  <title>Event List | Spartan Esports</title>
  <link rel="icon" href="images/uncg-esports-dr-sh-800.jpg">
</head>
<body>


<div class="topnav">
  <a data-th-href="@{/home}">Home</a>
  <a class="active" data-th-href="@{/calendar/list}">Events</a>
  <a data-th-href="@{/calendar/listc}">Calendar</a>
  <a data-th-href="@{/posts/all}">Discussion</a>
  <a data-th-href="@{/games/all}">View Teams</a>
  <a data-th-href="@{/coach/all}">Coaches</a>
  <a data-th-href="@{/admin/all}">Admin Settings</a>
  <a data-th-href="@{/users/login}"> Login </a>
  <a data-th-href="@{/profile/user}">Profile</a>
</div>


<br><br><br>

<h1>Events List</h1>

<div class="Section1">
  <table class="center" style="width:60%">
    <tr>
      <th>Event ID</th>
      <th>Name</th>
      <th>Date</th>
      <th>Location</th>
      <th>Participating</th>
      <th>Attending</th>
    </tr>
    <tr data-th-each="calendar : ${eventList}">
      <td data-th-text="${calendar.eventID}"></td>
      <td data-th-text="${calendar.name}"></td>
      <td data-th-text="${calendar.date}"></td>
      <td data-th-text="${calendar.location}"></td>
      <td data-th-text="${calendar.participating}"></td>
      <td data-th-text="${calendar.attending}"></td>
    </tr>
  </table>
</div>


</body>
</html>
