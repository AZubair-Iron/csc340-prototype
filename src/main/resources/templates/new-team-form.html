<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/stylehome.css">
    <title>New Team | Spartan Esports</title>
    <link rel="icon" href="images/uncg-esports-dr-sh-800.jpg">
</head>
<body>

<div class="topnav">
    <a data-th-href="@{/home}">Home</a>
    <a data-th-href="@{/calendar/list}">Events</a>
    <a data-th-href="@{/calendar/listc}">Calendar</a>
    <a data-th-href="@{/discussion/home}">Discussion</a>
    <a data-th-href="@{/games/all}">View Teams</a>
    <a data-th-href="@{/coach/all}">Coaches</a>
    <a class="active" data-th-href="@{/admin/all}">Admin Settings</a>
    <a data-th-href="@{/users/login}"> Login </a>
    <a data-th-href="@{/profile/user}">Profile</a>
</div>

<a data-th-href="@{/admin/all}" class="return">
    <span>Return</span>
</a>

<br>
<br>
<br>

<h1>New Team</h1>
<br><br>

<div class="Section1">
  <form action="/teams/add" method="post">
    Name:<input type="text" id="name" name="name" placeholder="Team Name">
    <br><br>

      Match Day:<input type="text" id="matchday" name="matchday" placeholder="What day does this team play?">
      <br><br>

      <div class="form-group">
          <h3>Select the game (Choose one)</h3>
          <div th:if="${gameList != null and not #lists.isEmpty(gameList)}" th:each="game : ${gameList}">
              <input type="radio" id="${game.gameId}" name="game" th:value="${game.gameId}" required />
              <label for="${game.gameId}" th:text="${game.game}"></label>
          </div>
      </div>

    <button type="submit">Save New Team</button>

  </form>
</div>

</body>
</html>
