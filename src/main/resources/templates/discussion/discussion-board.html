<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discussion Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
<div class="album py-5 bg-body-tertiary">

  <div class="container">
    <a href="/posts/createForm" class="btn btn-primary">Create a New Post</a>
    <hr>
    <h2>Discussion Board</h2>
    <table class="table striped-table">
      <tr>
        <th>Title</th>
        <th>Content</th>
      </tr>
      <tr data-th-each="post: ${discussion}">
        <td><a data-th-href="@{/posts/{postId} (postId=${post.postId})}"
               data-th-text="${post.postId}"></a></td>
        <td data-th-text="${post.title}"></td>
        <td data-th-text="${post.content}"></td>

        <td><a data-th-href="@{/post/{postId} (postId=${post.postId})}"
               class="btn btn-sm btn-outline-secondary">View</a>
          <a data-th-href="@{/posts/update/{postId} (postId=${post.postId})}"
             class="btn btn-sm btn-outline-secondary">Edit</a>
          <a data-th-href="@{/posts/delete/{postId} (postId=${post.postId})}"
             class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
      </tr>
    </table>
  </div>
</div>
</body>
</html>
