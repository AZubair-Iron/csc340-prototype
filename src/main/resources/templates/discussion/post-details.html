<body>

<div class="container">
  <div class="return">
    <a href="/posts/all"> Back </a>
  </div>



  <div class="container">
    <h1 data-th-text="${post.title}"></h1>
    <div class="card text-center">
      <div class="card-header" data-th-text=" ${post.title}">
      </div>
      <div class="card-body">
             <span style="float:right"> <a data-th-href="@{/posts/update/{postId} (postId=${post.postId})}"
                                           class="btn btn-primary">Edit</a></span>

        <p class="card-text" data-th-text="${post.content}"></p>
        <a data-th-href="@{/posts/delete/{postId}(postId=${post.postId})}" class="btn btn-danger">Delete</a>

        <a href="/posts/all" class="btn btn-primary">Go back</a>
      </div>
      <div class="card-footer text-body-secondary" data-th-text="${post.postId}">

      </div>
    </div>
  </div>

  <!-- one of the few functionally -->
  <div class="comment-box">
    <form method="post" action="/comments/comment}">
      <button data-th-href="@{/comments/comment}">Comment</button>
    </form>

  </div>

  <div class="comments-section">
    <h3>Comments</h3>
    <div id="comments-list">
      <!-- Comments will appear here -->
    </div>
  </div>
</div>
