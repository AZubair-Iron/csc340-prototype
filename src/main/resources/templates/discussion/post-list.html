<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav data-th-insert="~{./fragments/navigation :: #global-nav}"></nav>
<div class="album py-5 bg-body-tertiary">

  <div class="container">
    <h2>Discussion Board</h2>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
      <div data-th-each="post: ${postList}" class="col">
        <div class="card shadow-sm">
          <div class="card-header" data-th-text="${post.title}">
          </div>
          <div class="card-body">
            <p data-th-text="'ID: '+${post.id}"></p>
            <p class="card-text" data-th-text="${post.description}"></p>
            <div class="d-flex justify-content-between align-items-center">
              <a data-th-href="@{/posts/delete/{id} (id=${post.id})}"
                 class="btn btn-sm btn-outline-danger">Delete</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <hr>
    <a href="/posts/createForm" class="btn btn-primary">New Post</a>
  </div>
</div>
</body>
</html>
