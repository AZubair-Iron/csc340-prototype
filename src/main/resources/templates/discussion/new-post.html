<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav data-th-insert="~{./fragments/navigation :: #global-nav}"></nav>
<div class="container">
  <h1>Create a new Animal</h1>
  <form action="/posts/new" method="post">
    Title:<input type="text" class="form-control" id="title" name="title" placeholder="Title">

    Description: <textarea class="form-control" id="description" rows="5" name="description"
                           placeholder="Enter your content here..."></textarea>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
</body>
</html>
