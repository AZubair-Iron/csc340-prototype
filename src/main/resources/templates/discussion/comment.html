<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" data-th-href="@{/css/comments.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment</title>
</head>
<body>

  <div class="container">
    <div class="head"><h1>Post a Comment</h1></div>
    <div><span id="comment">0</span> Comments</div>
    <div class="text"><p>Comment Below</p></div>
    <div class="comments"></div>
    <div class="commentbox">
      <img src="https://bootdey.com/img/Content/avatar/avatar1.png" alt="">
      <div class="content">
        <h2>Comment as: </h2>
        <input type="text" value="Anonymous" class="user">

        <div class="commentinput">
          <input type="text" placeholder="Enter Comment" class="usercomment">
          <div class="buttons">
            <form method="post" action="/posts/all">
              <button type="submit" id="publish">Publish</button>
            </form>
            <div class="notify">
              <input type="checkbox" class="notifyinput"> <span>Notify me</span>
            </div>
          </div>
        </div>
        <p class="policy">This post is protected by SpartanEsports and UNCG <a data-th-href="@{/comments/privacy}">privacy policy</a> and <a data-th-href="@{/comments/services}">Terms of Services</a> apply. </p>
      </div>
    </div>
  </div>
