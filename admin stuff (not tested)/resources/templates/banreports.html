<body>

        <a class="active" href="homepage.html">Home</a>
        <a href="calendar.html">Events</a>

    <br>

    <h1>Ban Reports</h1>

    <table class="center" style="width:50%">
        <tr>
            <th>Reported User ID</th>
            <th>Reported Username:</th>
            <th>Ban Reason</th>
            <th>Status</th>
            <th>Edit/Remove Ban</th>
        </tr>
        <tr data-th-each="banned_list : ${banList}">
            <td data-th-text="${banned_list.user_id}"></td>
            <td data-th-text="${banned_list.user_name}"></td>
            <td data-th-text="${banned_list.offense}"></td>
            <td data-th-text="${banned_list.status}"></td>
            <td>
                <a data-th-href="@{/banlist/update/{id} (id=${banned_list.user_id})}"><button>Edit</button></a>
                <a data-th-href="@{/banlist/delete/{id} (id=${banned_list.user_id})}"><button>Remove</button></a>
            </td>
        </tr>
    </table>

    <br><br>
    <a data-th-href="@{/banlist/newBanForm}">
        <span>New Ban</span>
    </a>


    
</body>
</html>
