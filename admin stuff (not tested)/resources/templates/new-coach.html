<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/stylehome.css">
  <title>New Coaches</title>
  <link rel="icon" href="images/uncg-esports-dr-sh-800.jpg">
</head>
<body>
<br><br><br>

<h1>New Coach</h1>
<br>

<div class="Section1">
  <form action="/coaches/new" method="post">

    <label>Coach Name: </label>
    <input type="text" id="name" name="name" placeholder="Coach Name"/>
    <br><br>

    <label>Coach Rank: </label>
    <input type="text" id="rank" name="rank" placeholder="Coach Rank"/>
    <br><br>

    <label>Coach Rating: </label>
    <input type="text" id="rating" name="rating" placeholder="Coach Rating"/>
    <br><br>

    <label>Coach Game: </label>
    <input type="text" id="game" name="game" placeholder="Coach Game"/>

    <br><br><br>

    <button type="submit">Save</button>
  </form>

</div>


</body>
</html>
